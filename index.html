<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H &amp; M Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
    background: linear-gradient(#9fd8f5 0%, #cfeee0 55%, #e8f5c8 78%, #b5d98a 78.5%, #a3cf78 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 36px 20px 0;
  }
  /* sun */
  body::before {
    content: "";
    position: fixed; top: 26px; right: 40px;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, #ffe066 0 45%, rgba(255,224,102,.35) 60%, transparent 72%);
    pointer-events: none;
  }
  header {
    text-align: center;
    margin-bottom: 30px;
    position: relative;
  }
  .sign {
    display: inline-block;
    background: linear-gradient(#c08a4f, #9c6b3c);
    border: 5px solid #6b4a2b;
    border-radius: 14px;
    padding: 16px 40px;
    box-shadow: 0 8px 20px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.25);
  }
  .sign h1 {
    color: #fffdf2;
    font-size: clamp(28px, 6vw, 44px);
    letter-spacing: 1px;
    text-shadow: 0 2px 0 #6b4a2b;
  }
  .sign p { color: #f5e6c8; font-size: 15px; margin-top: 4px; }
  /* sign posts */
  header::after {
    content: "";
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: -26px; width: 12px; height: 26px;
    background: #8a6238; border-radius: 0 0 4px 4px;
    box-shadow: -70px 0 #8a6238, 70px 0 #8a6238;
    z-index: -1;
  }
  main {
    width: 100%; max-width: 980px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 26px;
    padding: 26px 0 60px;
  }
  .packet {
    background: #fffdf2;
    border: 4px solid #6b4a2b;
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    color: #4a4232;
    display: flex; flex-direction: column;
    box-shadow: 0 8px 18px rgba(40,60,30,.25);
    transition: transform .15s, box-shadow .15s;
    position: relative;
  }
  .packet:hover, .packet:focus-visible {
    transform: translateY(-6px) rotate(-1deg);
    box-shadow: 0 16px 28px rgba(40,60,30,.3);
  }
  /* seed-packet top band */
  .packet .band {
    background: repeating-linear-gradient(45deg, #e8f0d8 0 12px, #f5f9ec 12px 24px);
    border-bottom: 3px dashed #b8ab8a;
    padding: 6px 14px;
    font-size: 12px; font-weight: bold; letter-spacing: 2px;
    color: #8a7d5f; text-transform: uppercase;
  }
  .packet .art {
    font-size: 68px;
    text-align: center;
    padding: 26px 10px 18px;
    background: radial-gradient(circle at 50% 65%, #eef7dd 0 55%, transparent 70%);
  }
  .packet h2 { font-size: 21px; color: #2f6b2f; padding: 0 16px; }
  .packet p  { font-size: 14px; line-height: 1.45; padding: 6px 16px 14px; flex: 1; }
  .packet .play {
    margin: 0 16px 16px;
    text-align: center;
    background: #3f8f3f;
    border: 3px solid #2c632c;
    border-radius: 10px;
    color: #fff; font-weight: bold; font-size: 17px;
    padding: 9px 0;
    box-shadow: 0 4px 0 #2c632c;
  }
  .packet:active .play { transform: translateY(3px); box-shadow: 0 1px 0 #2c632c; }
  .packet.soon {
    opacity: .65;
    pointer-events: none;
    border-style: dashed;
  }
  .packet.soon .play { background: #a8a08a; border-color: #8a8270; box-shadow: 0 4px 0 #8a8270; }
  footer {
    color: #3d5a2e;
    font-size: 13px;
    padding: 0 0 26px;
    text-align: center;
  }
</style>
</head>
<body>
  <header>
    <div class="sign">
      <h1>🌱 H &amp; M Games</h1>
      <p>a little arcade, grown at home</p>
    </div>
  </header>

  <main id="shelf"></main>

  <footer>pick a packet to play · new seeds planted regularly</footer>

<script>
"use strict";
// Add a new game: drop its folder in games/<slug>/index.html and add a line here.
const GAMES = [
  {
    slug: "pea-patch-panic",
    emoji: "🫛",
    name: "Pea Patch Panic",
    blurb: "Peas swell on the vine — pick them at their plumpest, before they drop! Fill your basket against the clock.",
    kind: "Garden arcade",
  },
];
const COMING_SOON = 2; // placeholder packets to hint at what's growing

const shelf = document.getElementById("shelf");
for (const g of GAMES) {
  const a = document.createElement("a");
  a.className = "packet";
  a.href = "games/" + g.slug + "/";
  a.innerHTML = `
    <div class="band">${g.kind}</div>
    <div class="art">${g.emoji}</div>
    <h2>${g.name}</h2>
    <p>${g.blurb}</p>
    <div class="play">Play</div>`;
  shelf.appendChild(a);
}
for (let i = 0; i < COMING_SOON; i++) {
  const d = document.createElement("div");
  d.className = "packet soon";
  d.innerHTML = `
    <div class="band">Coming soon</div>
    <div class="art">🌰</div>
    <h2>Still sprouting…</h2>
    <p>A new game is germinating in the greenhouse. Check back soon!</p>
    <div class="play">Not yet</div>`;
  shelf.appendChild(d);
}
</script>
</body>
</html>
